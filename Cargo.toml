[package]
name = "sternegit"
version = "0.3.11"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
fancy-regex = { version = "0.16.2", default-features = false }
gix = "0.90.0"
gpui-kit = { version = "0.9.0", features = ["syntect"] }
image = { version = "0.25.10", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3", "aiff", "isomp4", "aac"] }
cpal = "0.18.2"
base64 = "0.22.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
smol = "2.0.2"
url = "2.5.8"
sternegit-protocol = { path = "connectors/protocol" }
sternegit-reader-protocol = { path = "readers/protocol" }
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime", "std", "async", "reexport-wasmparser"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.191"

[build-dependencies]
crc32fast = "1.5.4"
miniz_oxide = "0.8.9"

[dev-dependencies]
crc32fast = "1.5.4"
wat = { version = "1.228.0", default-features = false }

# Dependencies are optimized even in dev builds: gix walks history and GPUI renders
# frames far too slowly at opt-level 0, which would hide real performance problems.
[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-pre = { path = "vendor/gpui-pre" }
