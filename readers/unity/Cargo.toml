[package]
name = "sternegit-unity"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sternegit-reader-sdk = { path = "../sdk" }
serde_json = "1.0.154"

[build-dependencies]
sternegit-reader-sdk = { path = "../sdk" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
