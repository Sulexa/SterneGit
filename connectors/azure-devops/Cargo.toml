[package]
name = "sternegit-azure-devops"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sternegit-sdk = { path = "../sdk" }
serde_json = "1.0.154"

[build-dependencies]
sternegit-sdk = { path = "../sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
