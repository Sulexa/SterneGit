name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release

jobs:
  windows:
    runs-on: windows-latest
    env:
      STERNEGIT_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the pinned Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'sternegit'
          $tag = "v$($package.version)"
          gh release view $tag *> $null
          $released = $LASTEXITCODE -eq 0
          if ($released) {
            Write-Output "::warning::$tag is already released. Set a new version in Cargo.toml to release this commit."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$(if ($released) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Let the tests make commits and the release make a tag
        run: |
          git config --global user.name "SterneGit CI"
          git config --global user.email "ci@sternegit.invalid"

      - name: Test
        run: cargo test --release --locked

      - name: Package
        if: steps.version.outputs.release == 'true'
        run: ./scripts/package-release.ps1 -Tag "${{ steps.version.outputs.tag }}" -Repository "${{ github.repository }}" -Feed $env:STERNEGIT_UPDATE_FEED

      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $version = $env:TAG.Substring(1)
          $tagged = git rev-parse -q --verify "$($env:TAG)^{commit}"
          if (-not $tagged) {
            git tag -a $env:TAG -m "SterneGit $version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "refs/tags/$($env:TAG)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          elseif ($tagged -ne $env:GITHUB_SHA) {
            Write-Output "::error::$($env:TAG) already names $tagged, not this commit $($env:GITHUB_SHA)."
            exit 1
          }
          $flags = @()
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release create $env:TAG --verify-tag --title "SterneGit $version" --notes-file dist/notes.md @flags `
            "dist/SterneGit-Setup-$version.exe" "dist/SterneGit-$version-portable.zip" dist/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
